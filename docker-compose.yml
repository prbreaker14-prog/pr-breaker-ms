version: "3.9"

networks:
  prbreaker-net:
    driver: bridge

services:

  # ── Identity Service ────────────────────────────────────────────────────────
  identity-service:
    build:
      context: .
      dockerfile: services/identity-service/Dockerfile
    container_name: identity-service
    environment:
      PORT: "5000"
      JWT_SECRET: "super-secret-change-me"
      DATABASE_URL: "postgresql+psycopg2://identity_user:identity_password@identity-db:5432/identity_db"
      WORKOUT_SERVICE_URL: "http://workout-service:5000"
    depends_on:
      identity-db:
        condition: service_healthy        # wait for Postgres to be ready
    ports:
      - "5001:5000"
    networks:
      - prbreaker-net

  # ── Workout Service ─────────────────────────────────────────────────────────
  workout-service:
    build:
      context: .
      dockerfile: services/workout-service/Dockerfile
    container_name: workout-service
    environment:
      PORT: "5000"
      JWT_SECRET: "super-secret-change-me"
      DATABASE_URL: "postgresql+psycopg2://workout_user:workout_password@workout-db:5432/workout_db"
      IDENTITY_SERVICE_URL: "http://identity-service:5000"
    depends_on:
      workout-db:
        condition: service_healthy        # wait for Postgres to be ready
      identity-service:
        condition: service_started
    ports:
      - "5002:5000"
    networks:
      - prbreaker-net

  # ── Performance Service ─────────────────────────────────────────────────────
  performance-service:
    build:
      context: .
      dockerfile: services/performance-service/Dockerfile
    container_name: performance-service
    environment:
      PORT: "5000"
      JWT_SECRET: "super-secret-change-me"
      DATABASE_URL: "postgresql+psycopg2://performance_user:performance_password@performance-db:5432/performance_db"  # fix 1: correct var name + correct db name
      IDENTITY_SERVICE_URL: "http://identity-service:5000"
      WORKOUT_SERVICE_URL: "http://workout-service:5000"
      BYPASS_AUTH: "true"   
    depends_on:
      performance-db:
        condition: service_healthy        # wait for Postgres to be ready
      workout-service:
        condition: service_started
    ports:
      - "5004:5000"
    networks:
      - prbreaker-net

  workoutgroups-service:
    build:
      context: .
      dockerfile: services/workoutgroups-service/Dockerfile
    container_name: workoutgroups-service
    environment:
      PORT: "5000"
      JWT_SECRET: "super-secret-change-me"
      WGROUPS_DATABASE_URL: "postgresql+psycopg2://wgroups_user:wgroups_password@wgroups-db:5432/class_db"
      IDENTITY_SERVICE_URL: "http://identity-service:5000"
      WORKOUT_SERVICE_URL: "http://workout-service:5000"
      WGROUPS_SERVICE_URL: "http://workoutgroups-service:5000"
    depends_on:
      - wgroups-db
      - identity-service
    ports:
      - "5003:5000"

  identity-db:
    image: postgres:16-alpine
    container_name: identity-db
    environment:
      POSTGRES_DB: identity_db
      POSTGRES_USER: identity_user
      POSTGRES_PASSWORD: identity_password
    volumes:
      - identity-db-data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    networks:
      - prbreaker-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U identity_user -d identity_db"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ── Workout DB ──────────────────────────────────────────────────────────────
  workout-db:
    image: postgres:16-alpine
    container_name: workout-db
    environment:
      POSTGRES_DB: workout_db
      POSTGRES_USER: workout_user
      POSTGRES_PASSWORD: workout_password
    volumes:
      - workout-db-data:/var/lib/postgresql/data
    ports:
      - "5434:5432"                       # fix 2: unique host port
    networks:
      - prbreaker-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U workout_user -d workout_db"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ── Performance DB ──────────────────────────────────────────────────────────
  performance-db:
    image: postgres:16-alpine
    container_name: performance-db
    environment:
      POSTGRES_DB: performance_db
      POSTGRES_USER: performance_user
      POSTGRES_PASSWORD: performance_password
    volumes:
      - performance-db-data:/var/lib/postgresql/data
    ports:
      - "5435:5432"                       # fix 2: was 5434, now unique
    networks:
      - prbreaker-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U performance_user -d performance_db"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  wgroups-db:
    image: postgres:16-alpine
    container_name: wgroups-db
    environment:
      POSTGRES_DB: class_db
      POSTGRES_USER: wgroups_user
      POSTGRES_PASSWORD: wgroups_password
    volumes:
      - wgroups-db-data:/var/lib/postgresql/data
    ports:
      - "5435:5432"

volumes:
  identity-db-data:
  workout-db-data:
  performance-db-data:
  wgroups-db-data:

