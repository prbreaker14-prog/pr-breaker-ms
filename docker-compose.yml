version: "3.9"

services:
  identity-service:
    build:
      context: .
      dockerfile: services/identity-service/Dockerfile
    container_name: identity-service
    environment:
      PORT: "5000"
      JWT_SECRET: "super-secret-change-me"
      IDENTITY_DATABASE_URL: "postgresql+psycopg2://identity_user:identity_password@identity-db:5432/identity_db"
      IDENTITY_SERVICE_URL: "http://identity-service:5000"
      WORKOUT_SERVICE_URL: "http://workout-service:5000"
    depends_on:
      - identity-db
    ports:
      - "5001:5000"

  workout-service:
    build:
      context: .
      dockerfile: services/workout-service/Dockerfile
    container_name: workout-service
    environment:
      PORT: "5000"
      JWT_SECRET: "super-secret-change-me"
      WORKOUT_DATABASE_URL: "postgresql+psycopg2://workout_user:workout_password@workout-db:5432/workout_db"
      IDENTITY_SERVICE_URL: "http://identity-service:5000"
      WORKOUT_SERVICE_URL: "http://workout-service:5000"
    depends_on:
      - workout-db
      - identity-service
    ports:
      - "5002:5000"

  workoutgroups-service:
    build:
      context: .
      dockerfile: services/workoutgroups-service/Dockerfile
    container_name: workoutgroups-service
    environment:
      PORT: "5000"
      JWT_SECRET: "super-secret-change-me"
      WGROUPS_DATABASE_URL: "postgresql+psycopg2://wgroups_user:wgroups_password@wgroups-db:5432/class_db"
      IDENTITY_SERVICE_URL: "http://identity-service:5000"
      WORKOUT_SERVICE_URL: "http://workout-service:5000"
      WGROUPS_SERVICE_URL: "http://workoutgroups-service:5000"
    depends_on:
      - wgroups-db
      - identity-service
    ports:
      - "5003:5000"

  identity-db:
    image: postgres:16-alpine
    container_name: identity-db
    environment:
      POSTGRES_DB: identity_db
      POSTGRES_USER: identity_user
      POSTGRES_PASSWORD: identity_password
    volumes:
      - identity-db-data:/var/lib/postgresql/data
    ports:
      - "5433:5432"

  workout-db:
    image: postgres:16-alpine
    container_name: workout-db
    environment:
      POSTGRES_DB: workout_db
      POSTGRES_USER: workout_user
      POSTGRES_PASSWORD: workout_password
    volumes:
      - workout-db-data:/var/lib/postgresql/data
    ports:
      - "5434:5432"

  wgroups-db:
    image: postgres:16-alpine
    container_name: wgroups-db
    environment:
      POSTGRES_DB: class_db
      POSTGRES_USER: wgroups_user
      POSTGRES_PASSWORD: wgroups_password
    volumes:
      - wgroups-db-data:/var/lib/postgresql/data
    ports:
      - "5435:5432"

volumes:
  identity-db-data:
  workout-db-data:
  wgroups-db-data:

