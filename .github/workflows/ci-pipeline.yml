name: PRBREAKER Build & Push

on:
  pull_request:
    types: [closed]
    branches:
      - helm-prebreaker

  workflow_dispatch:
    inputs:
      services:
        description: 'Services to build (comma-separated: auth,apigateway,performance,workout,workoutgroups) or "all"'
        required: true
        default: 'all'
      # environment:
      #   description: 'Target environment'
      #   required: true
      #   default: 'staging'
      #   type: choice
      #   options:
      #     - staging
      #     - production

env:
  IMAGE_PREFIX: ${{ secrets.DOCKERHUB_USERNAME }}
permissions:
  contents: write 

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' && github.event.pull_request.merged == true)
    outputs:
      auth: ${{ steps.filter.outputs.auth }}
      apigateway: ${{ steps.filter.outputs.apigateway }}
      performance: ${{ steps.filter.outputs.performance }}
      workout: ${{ steps.filter.outputs.workout }}
      workoutgroups: ${{ steps.filter.outputs.workoutgroups }}
      run_all: ${{ steps.manual.outputs.run_all }}
      branch_sha: ${{ steps.get-sha.outputs.sha }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get helm-prebreaker SHA
        id: get-sha
        run: |
          git fetch origin helm-prebreaker
          BRANCH_SHA=$(git rev-parse origin/helm-prebreaker)
          echo "sha=$BRANCH_SHA" >> $GITHUB_OUTPUT
          echo "📌 helm-prebreaker SHA: $BRANCH_SHA"

      - name: Parse manual service selection
        id: manual
        if: github.event_name == 'workflow_dispatch'
        run: |
          INPUT="${{ github.event.inputs.services }}"
          if [ "$INPUT" = "all" ]; then
            echo "run_all=true" >> $GITHUB_OUTPUT
          else
            echo "run_all=false" >> $GITHUB_OUTPUT
            echo "auth=$(echo $INPUT | grep -c 'auth' || true)" >> $GITHUB_OUTPUT
            echo "apigateway=$(echo $INPUT | grep -c 'apigateway' || true)" >> $GITHUB_OUTPUT
            echo "performance=$(echo $INPUT | grep -c 'performance' || true)" >> $GITHUB_OUTPUT
            echo "workout=$(echo $INPUT | grep -c 'workout' || true)" >> $GITHUB_OUTPUT
            echo "workoutgroups=$(echo $INPUT | grep -c 'workoutgroups' || true)" >> $GITHUB_OUTPUT
          fi

      - name: Detect changed services
        id: filter
        if: github.event_name == 'pull_request'
        uses: dorny/paths-filter@v3
        with:
          filters: |
            auth:
              - 'services/identity-service/**'
            apigateway:
              - 'services/api-gateway/**'
            performance:
              - 'services/performance-service/**'
            workout:
              - 'services/workout-service/**'
            workoutgroups:
              - 'services/workoutgroups-service/**'

  build-auth:
    needs: detect-changes
    runs-on: ubuntu-latest
    if: |
      needs.detect-changes.outputs.run_all == 'true' ||
      needs.detect-changes.outputs.auth == 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: helm-prebreaker
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build and push auth
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./services/identity-service/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}/identity-service:${{ needs.detect-changes.outputs.branch_sha }}
            ${{ env.IMAGE_PREFIX }}/identity-service:latest

  build-apigateway:
    needs: detect-changes
    runs-on: ubuntu-latest
    if: |
      needs.detect-changes.outputs.run_all == 'true' ||
      needs.detect-changes.outputs.apigateway == 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: helm-prebreaker
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build and push apigateway
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./services/api-gateway/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}/api-gateway:${{ needs.detect-changes.outputs.branch_sha }}
            ${{ env.IMAGE_PREFIX }}/api-gateway:latest

  build-performance:
    needs: detect-changes
    runs-on: ubuntu-latest
    if: |
      needs.detect-changes.outputs.run_all == 'true' ||
      needs.detect-changes.outputs.performance == 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: helm-prebreaker
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build and push performance
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./services/performance-service/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}/performance-service:${{ needs.detect-changes.outputs.branch_sha }}
            ${{ env.IMAGE_PREFIX }}/performance-service:latest

  build-workout:
    needs: detect-changes
    runs-on: ubuntu-latest
    if: |
      needs.detect-changes.outputs.run_all == 'true' ||
      needs.detect-changes.outputs.workout == 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: helm-prebreaker
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build and push workout
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./services/workout-service/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}/workout-service:${{ needs.detect-changes.outputs.branch_sha }}
            ${{ env.IMAGE_PREFIX }}/workout-service:latest

  build-workoutgroups:
    needs: detect-changes
    runs-on: ubuntu-latest
    if: |
      needs.detect-changes.outputs.run_all == 'true' ||
      needs.detect-changes.outputs.workoutgroups == 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: helm-prebreaker
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build and push workoutgroups
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./services/workoutgroups-service/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}/workoutgroups-service:${{ needs.detect-changes.outputs.branch_sha }}
            ${{ env.IMAGE_PREFIX }}/workoutgroups-service:latest

  update-helm-values:
    runs-on: ubuntu-latest
    needs: [detect-changes, build-auth, build-apigateway, build-performance, build-workout, build-workoutgroups]
    if: |
      always() && !cancelled() &&
      (
        needs.build-auth.result == 'success' ||
        needs.build-apigateway.result == 'success' ||
        needs.build-performance.result == 'success' ||
        needs.build-workout.result == 'success' ||
        needs.build-workoutgroups.result == 'success'
      )
    steps:
      - name: Checkout helm-prbreaker-cd branch
        uses: actions/checkout@v4
        with:
          ref: helm-prbreaker-cd
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Install yq
        run: |
          sudo wget -qO /usr/local/bin/yq \
            https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64
          sudo chmod +x /usr/local/bin/yq

      - name: Update image tags for built services only
        run: |
          SHA="${{ needs.detect-changes.outputs.branch_sha }}"
          SHORT_SHA="${SHA::7}"

          if [ "${{ needs.build-auth.result }}" = "success" ]; then
            yq -i ".image.tag = \"$SHA\"" helm/charts/identity-service/values.yaml
            echo "✅ Updated identity-service to $SHA"
          fi
          if [ "${{ needs.build-apigateway.result }}" = "success" ]; then
            yq -i ".image.tag = \"$SHA\"" helm/charts/api-gateway/values.yaml
            echo "✅ Updated api-gateway to $SHA"
          fi
          if [ "${{ needs.build-performance.result }}" = "success" ]; then
            yq -i ".image.tag = \"$SHA\"" helm/charts/performance-service/values.yaml
            echo "✅ Updated performance-service to $SHA"
          fi
          if [ "${{ needs.build-workout.result }}" = "success" ]; then
            yq -i ".image.tag = \"$SHA\"" helm/charts/workout-service/values.yaml
            echo "✅ Updated workout-service to $SHA"
          fi
          if [ "${{ needs.build-workoutgroups.result }}" = "success" ]; then
            yq -i ".image.tag = \"$SHA\"" helm/charts/workoutgroups-service/values.yaml
            echo "✅ Updated workoutgroups-service to $SHA"
          fi

      - name: Commit and push to helm-prbreaker-cd
        run: |
          SHA="${{ needs.detect-changes.outputs.branch_sha }}"
          SHORT_SHA="${SHA::7}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add helm/charts/*/values.yaml
          if git diff --staged --quiet; then
            echo "No values changed, skipping commit"
          else
            git commit -m "cd: update image tags to $SHORT_SHA (helm-prebreaker)"
            git push origin helm-prbreaker-cd
          fi

  notify:
    runs-on: ubuntu-latest
    needs: [build-auth, build-apigateway, build-performance, build-workout, build-workoutgroups]
    if: always()
    steps:
      - name: Pipeline summary
        run: |
          echo "## Build Results" >> $GITHUB_STEP_SUMMARY
          echo "| Service | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|---------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| auth | ${{ needs.build-auth.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| apigateway | ${{ needs.build-apigateway.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| performance | ${{ needs.build-performance.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| workout | ${{ needs.build-workout.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| workoutgroups | ${{ needs.build-workoutgroups.result }} |" >> $GITHUB_STEP_SUMMARY
